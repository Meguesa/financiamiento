name: Migrar Financiamiento productivo al repo propio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrar-produccion.yml'

permissions:
  contents: write

jobs:
  migrate:
    name: Copiar version productiva y dejar repo autonomo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repo financiamiento
        uses: actions/checkout@v6
        with:
          path: financiamiento-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar fuente productiva actual
        uses: actions/checkout@v6
        with:
          repository: Meguesa/meguesa.github.io
          ref: main
          path: fuente-productiva

      - name: Migrar archivos funcionales sin alterar logica
        shell: bash
        run: |
          set -euo pipefail

          cp fuente-productiva/app.js financiamiento-repo/app.js
          cp fuente-productiva/styles.css financiamiento-repo/styles.css
          cp fuente-productiva/manifest.webmanifest financiamiento-repo/manifest.webmanifest
          cp fuente-productiva/sw.js financiamiento-repo/sw.js

          rm -rf financiamiento-repo/assets financiamiento-repo/icons
          cp -R fuente-productiva/assets financiamiento-repo/assets
          cp -R fuente-productiva/icons financiamiento-repo/icons

          cp fuente-productiva/index.html financiamiento-repo/index.source.html

      - name: Generar entrada PHP con sesion compartida del Portal
        shell: bash
        run: |
          set -euo pipefail
          cd financiamiento-repo

          python3 <<'PY'
          from pathlib import Path

          source = Path('index.source.html').read_text(encoding='utf-8')

          source = source.replace('<link rel="manifest" href="./manifest.webmanifest" />\n', '')
          source = source.replace(
              '<link rel="stylesheet" href="./styles.css" />',
              '<link rel="stylesheet" href="./styles.css" />\n  <link rel="stylesheet" href="./portal-integration.css" />\n  <link rel="stylesheet" href="./account-menu.css" />'
          )
          source = source.replace(
              '<title>Ventas con Financiamiento</title>',
              '<title>Ventas con Financiamiento | Portal JdJP</title>'
          )

          toolbar = '''<body class="financing-page">
          <nav class="portal-toolbar" aria-label="Navegación del portal">
            <div class="portal-toolbar-inner">
              <div class="portal-toolbar-title-wrap">
                <img class="portal-toolbar-logo" src="./assets/logo.jpg" alt="Jardines de Juan Pablo">
                <div class="portal-toolbar-title">
                  <strong>Ventas con Financiamiento</strong>
                  <span>Portal Interno JdJP · Jardines de Juan Pablo</span>
                </div>
              </div>
              <div class="portal-toolbar-actions">
                <a class="portal-toolbar-link" href="/">Regresar al portal</a>
                <details class="account-menu">
                  <summary class="account-trigger" aria-label="Abrir menú de usuario" title="<?= $name ?>">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></svg>
                  </summary>
                  <div class="account-menu-panel">
                    <div class="account-menu-info"><strong><?= $name ?></strong><span><?= $email ?></span></div>
                    <a class="account-menu-logout" href="/logout.php">Cerrar sesión</a>
                  </div>
                </details>
              </div>
            </div>
          </nav>'''

          source = source.replace('<body>', toolbar, 1)

          start = source.find('<header class="app-header">')
          end = source.find('</header>', start)
          if start != -1 and end != -1:
              source = source[:start] + source[end + len('</header>'):]

          php = '''<?php
          declare(strict_types=1);

          // Unica dependencia compartida con el Portal: autenticacion/sesion.
          require_once dirname(__DIR__) . '/includes/bootstrap.php';
          portal_require_authentication();

          $user = portal_user();
          $name = htmlspecialchars((string) ($user['name'] ?? 'Usuario'), ENT_QUOTES, 'UTF-8');
          $email = htmlspecialchars((string) ($user['email'] ?? ''), ENT_QUOTES, 'UTF-8');
          ?>
          '''

          Path('index.php').write_text(php + source, encoding='utf-8')
          PY

          rm -f index.source.html index.html

      - name: Validar que la app productiva fue copiada completa
        shell: bash
        run: |
          set -euo pipefail
          cd financiamiento-repo
          test -s index.php
          test -s app.js
          test -s styles.css
          test -s portal-integration.css
          test -s account-menu.css
          test -s assets/logo.jpg
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          php -l index.php

          grep -q 'Simulación de Abono a Capital' index.php
          grep -q 'btnCompartir' app.js
          grep -q 'firmaCanvas' app.js

      - name: Guardar migracion en el repo financiamiento
        shell: bash
        run: |
          set -euo pipefail
          cd financiamiento-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios nuevos que guardar.'
          else
            git commit -m 'Migrar version productiva de Financiamiento al repo propio'
            git push origin HEAD:main
          fi

      - name: Confirmar disparo de migracion
        run: echo 'Workflow de migracion ejecutado desde main.'
